<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Library</title>
<style>
body{margin:0;background:#101216;color:#eee;font-family:system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:20px}
nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
a{color:#80aaff}
button,input,select{font:inherit}
button{cursor:pointer}
.card{background:#181b21;padding:18px;border-radius:14px;margin:14px 0}
.controls{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px;align-items:end}
label{display:block;font-weight:600;margin-bottom:6px}
input,select{box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #3b404a;border-radius:9px;background:#0e1014;color:#eee}
.primary{padding:10px 14px;border:0;border-radius:9px;background:#3478f6;color:white}
.danger{padding:8px 11px;border:1px solid #7b3030;border-radius:8px;background:#35191b;color:#ffb4b4}
.secondary{padding:8px 11px;border:1px solid #454b56;border-radius:8px;background:#22262d;color:#eee}
.status{min-height:1.3em;color:#aeb6c3}
.song{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid #30343d;align-items:center}
.song:last-child{border-bottom:0}
.song-title{font-weight:650;overflow-wrap:anywhere}
.song-meta{font-size:.9rem;color:#aeb6c3;margin-top:4px}
.song-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
audio{width:100%;max-width:560px;margin-top:9px}
.empty{color:#aeb6c3;padding:20px 0}
.hidden{display:none}
@media(max-width:700px){
  main{padding:14px}
  .controls{grid-template-columns:1fr}
  .song{grid-template-columns:1fr}
  .song-actions{justify-content:flex-start}
}


.persistent-player{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#181b21;border-top:1px solid #383d48;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
.persistent-player-inner{max-width:1100px;margin:auto;padding:7px 14px;display:grid;grid-template-columns:minmax(140px,1fr) auto;gap:6px 12px;align-items:center}
.mini-song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem;font-weight:600}
.mini-controls{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mini-controls button{min-width:38px;height:38px;padding:0 8px;font-size:15px;display:grid;place-items:center;border:0;border-radius:7px;background:#2b6df3;color:#fff;cursor:pointer}
.mini-controls button.active{background:#24a148}
.mini-controls button:disabled{opacity:.4;cursor:not-allowed}
.mini-popover-wrap{position:relative;display:flex;align-items:center}
.mini-popover{position:absolute;right:0;bottom:46px;z-index:1100;min-width:230px;padding:12px;background:#181b21;border:1px solid #454b56;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:grid;gap:8px;text-align:left}
.mini-popover[hidden]{display:none}
.mini-popover label{font-size:.8rem;color:#aeb6c3}
.mini-popover select,.mini-popover input,.mini-popover button{font:inherit;box-sizing:border-box;width:100%;min-height:38px;padding:8px 10px;border-radius:8px;border:1px solid #454b56;background:#0e1014;color:#fff}
.mini-popover button{background:#2b6df3;border:0;cursor:pointer}
.mini-popover-status{min-height:1.1em;font-size:.76rem;color:#aeb6c3;overflow-wrap:anywhere}
.mini-popover-heading{font-size:.85rem;font-weight:700;color:#fff}
.mini-shuffle-popover{min-width:270px;max-width:min(330px,calc(100vw - 20px))}
.mini-shuffle-options{max-height:240px;overflow:auto;display:grid;gap:3px;padding:2px}
.mini-shuffle-option{display:flex;align-items:center;gap:9px;min-height:40px;padding:6px 7px;border-radius:7px;cursor:pointer;color:#fff}
.mini-shuffle-option:hover{background:#242932}
.mini-shuffle-option input{width:18px;height:18px;flex:0 0 auto;margin:0;padding:0}
.mini-shuffle-option span{min-width:0;overflow-wrap:anywhere}
.mini-popover-actions{display:flex;gap:6px}
.mini-popover-actions button{width:auto;flex:1}
.mini-volume-note{font-size:.7rem;line-height:1.3;color:#aeb6c3}
.mini-volume-popover{min-width:190px}
.mini-volume-popover input[type="range"]{padding:0;accent-color:#2b6df3}
.mini-volume-popover output{font-size:.8rem;color:#aeb6c3;text-align:right}
.mini-progress{grid-column:1 / -1;display:grid;grid-template-columns:auto minmax(80px,1fr) auto;gap:8px;align-items:center;font-size:.75rem;color:#aeb6c3}
.mini-progress-track{position:relative;width:100%;height:20px;display:flex;align-items:center}
.mini-progress-track .mini-buffered{position:absolute;left:0;right:auto;top:50%;height:4px;transform:translateY(-50%);width:0;background:#70757d;border-radius:3px;pointer-events:none}
.mini-progress-track input{position:relative;z-index:1;width:100%;margin:0;padding:0;accent-color:#2b6df3;background:transparent}
.persistent-player audio{display:none}
body{padding-bottom:92px}
@media(max-width:600px){
  .persistent-player-inner{padding:6px 8px;grid-template-columns:1fr}
  .mini-song{font-size:.82rem}
  .mini-controls{justify-content:center}
  .mini-controls button{min-width:36px;height:36px;padding:0 6px;font-size:14px}
  .mini-progress{gap:5px}
  body{padding-bottom:112px}
}

</style>
</head>
<body>
<div id="persistentPlayer" class="persistent-player" hidden>
  <div class="persistent-player-inner">
    <div class="mini-song" id="persistentTitle">Nothing playing</div>
    <div class="mini-controls" aria-label="Music controls">
      <button id="miniPrevious" type="button" aria-label="Previous song">⏮</button>
      <button id="miniPlayPause" type="button" aria-label="Play or pause">▶</button>
      <button id="miniNext" type="button" aria-label="Next song">⏭</button>
      <button id="miniAutoplay" type="button" aria-label="Toggle autoplay" aria-pressed="true">AUTO</button>
      <button id="miniLoop" type="button" aria-label="Toggle loop" aria-pressed="false">↻</button>
      <div class="mini-popover-wrap">
        <button id="miniShufflePlaylist" type="button" aria-label="Choose shuffle playlists" aria-expanded="false" aria-haspopup="dialog">📂</button>
        <div id="miniShuffleMenu" class="mini-popover mini-shuffle-popover" hidden role="dialog" aria-label="Shuffle playlist selection">
          <div class="mini-popover-heading">Shuffle from playlists</div>
          <div id="miniShufflePlaylistOptions" class="mini-shuffle-options" aria-label="Playlists to include in shuffle"></div>
          <div class="mini-popover-actions">
            <button id="miniShufflePlaylistSelectAll" type="button">All</button>
            <button id="miniShufflePlaylistClear" type="button">Clear</button>
          </div>
          <button id="miniShufflePlaylistApply" type="button">Shuffle selected playlists</button>
          <div id="miniShuffleStatus" class="mini-popover-status" aria-live="polite"></div>
        </div>
      </div>
      <button id="miniShuffle" type="button" aria-label="Toggle shuffle" aria-pressed="false">🔀</button>
      <div class="mini-popover-wrap">
        <button id="miniVolume" type="button" aria-label="Volume" aria-expanded="false" aria-haspopup="dialog">🔊</button>
        <div id="miniVolumeMenu" class="mini-popover mini-volume-popover" hidden role="dialog" aria-label="Volume control">
          <div class="mini-popover-heading">Volume &amp; amplify</div>
          <label for="miniVolumeSlider">0–200%</label>
          <input id="miniVolumeSlider" type="range" min="0" max="2" step="0.01" value="1" aria-label="Volume and amplification" aria-valuemin="0" aria-valuemax="200" aria-valuenow="100" aria-valuetext="100%">
          <output id="miniVolumeValue">100%</output>
          <div class="mini-volume-note">Above 100% uses audio amplification. Very high levels can cause clipping or distortion.</div>
        </div>
      </div>
    </div>
    <div class="mini-progress">
      <span id="miniCurrentTime">0:00</span>
      <div class="mini-progress-track" role="group" aria-label="Song loading and position"><div id="miniBuffered" class="mini-buffered" role="progressbar" aria-label="Buffered audio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div><input id="miniProgress" type="range" min="0" max="0" value="0" step="0.1" aria-label="Song position" disabled></div>
      <span id="miniDuration">0:00</span>
    </div>
    <audio id="persistentAudio" preload="metadata" playsinline></audio>
  </div>
</div>
<main>
<nav>
<a href="{{ url_for('index') }}">Downloader</a>
<a href="{{ url_for('player') }}">Player</a>
<a href="{{ url_for('library') }}">Library</a>
<form method="post" action="{{ url_for('logout') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button class="secondary" type="submit">Log out</button>
</form>
</nav>

<h1>Music Library</h1>
<p>Select a playlist to load its songs. The library no longer loads every playlist at once.</p>

<section class="card">
<div class="controls">
<div>
<label for="playlistSelect">Playlist</label>
<select id="playlistSelect">
<option value="">Choose a playlist...</option>
{% for name in playlist_names %}
<option value="{{ name }}">{{ name }}</option>
{% endfor %}
</select>
</div>
<button id="loadButton" class="primary" type="button">Load playlist</button>
</div>
<p id="libraryStatus" class="status" aria-live="polite"></p>
</section>

<section id="playlistCard" class="card hidden">
<h2 id="playlistTitle"></h2>
<div id="songList"></div>
</section>

<script nonce="{{ csp_nonce }}">
const csrfToken = {{ csrf_token|tojson }};
const playlistSelect = document.getElementById("playlistSelect");
const loadButton = document.getElementById("loadButton");
const libraryStatus = document.getElementById("libraryStatus");
const playlistCard = document.getElementById("playlistCard");
const playlistTitle = document.getElementById("playlistTitle");
const songList = document.getElementById("songList");

function setStatus(message) {
    libraryStatus.textContent = message || "";
}

function apiOptions() {
    return {
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken,
        },
        credentials: "same-origin",
    };
}

function createButton(text, className) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = className;
    button.textContent = text;
    return button;
}

function renderSongs(songs) {
    songList.replaceChildren();

    if (!songs.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "This playlist is empty.";
        songList.appendChild(empty);
        return;
    }

    for (const song of songs) {
        const row = document.createElement("article");
        row.className = "song";
        row.dataset.path = song.path;
        row.dataset.driveIndex = String(song.drive_index);

        const details = document.createElement("div");
        const title = document.createElement("div");
        title.className = "song-title";
        title.textContent = song.title;
        details.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "song-meta";
        meta.textContent = `${song.size} · Drive ${song.drive_index + 1}`;
        details.appendChild(meta);

        const playButton = createButton("Play in mini-player", "primary");
        playButton.addEventListener("click", () => {
            const rows = Array.from(songList.querySelectorAll(".song"));
            const index = rows.indexOf(row);
            if (window.PersistentPlayer && index >= 0) {
                const songs = rows.map(item => ({
                    title: item.querySelector(".song-title")?.textContent || "",
                    url: item.dataset.url || ""
                })).filter(item => item.url);
                window.PersistentPlayer.setQueue(songs, Math.min(index, songs.length - 1), playlistSelect.value, true);
            }
        });
        details.appendChild(playButton);
        row.dataset.url = song.url;

        const actions = document.createElement("div");
        actions.className = "song-actions";

        const renameButton = createButton("Rename", "secondary");
        renameButton.addEventListener("click", () => renameSong(row, song));
        actions.appendChild(renameButton);

        const deleteButton = createButton("Delete", "danger");
        deleteButton.addEventListener("click", () => deleteSong(row, song));
        actions.appendChild(deleteButton);

        row.appendChild(details);
        row.appendChild(actions);
        songList.appendChild(row);
    }
}

async function loadPlaylist() {
    const name = playlistSelect.value;
    if (!name) {
        playlistCard.classList.add("hidden");
        setStatus("Choose a playlist first.");
        return;
    }

    loadButton.disabled = true;
    setStatus(`Loading ${name}...`);

    try {
        const response = await fetch(`/api/library/${encodeURIComponent(name)}`, {
            credentials: "same-origin",
        });
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not load playlist.");
        }

        playlistTitle.textContent = `${data.playlist} (${data.songs.length} song${data.songs.length === 1 ? "" : "s"})`;
        renderSongs(data.songs);
        playlistCard.classList.remove("hidden");
        setStatus(`Loaded ${data.songs.length} song${data.songs.length === 1 ? "" : "s"}.`);
    } catch (error) {
        playlistCard.classList.add("hidden");
        setStatus(error.message || "Could not load playlist.");
    } finally {
        loadButton.disabled = false;
    }
}

async function renameSong(row, song) {
    const currentName = song.title;
    const newName = window.prompt("New song name:", currentName);

    if (newName === null) {
        return;
    }

    const trimmed = newName.trim();
    if (!trimmed) {
        setStatus("Song name cannot be empty.");
        return;
    }

    try {
        const response = await fetch("{{ url_for('rename_library_song') }}", {
            method: "POST",
            ...apiOptions(),
            body: JSON.stringify({
                drive_index: song.drive_index,
                path: song.path,
                name: trimmed,
            }),
        });
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not rename song.");
        }

        song.title = data.title;
        song.filename = data.filename;
        song.path = data.path;
        song.url = data.url;
        row.dataset.path = data.path;

        const titleElement = row.querySelector(".song-title");
        const audio = row.querySelector("audio");
        titleElement.textContent = data.title;
        audio.src = data.url;
        setStatus(`Renamed to ${data.title}.`);
    } catch (error) {
        setStatus(error.message || "Could not rename song.");
    }
}

async function deleteSong(row, song) {
    if (!window.confirm(`Delete "${song.title}"? This permanently removes the MP3 from the library.`)) {
        return;
    }

    try {
        const response = await fetch("{{ url_for('delete_library_song') }}", {
            method: "POST",
            ...apiOptions(),
            body: JSON.stringify({
                drive_index: song.drive_index,
                path: song.path,
            }),
        });
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not delete song.");
        }

        row.remove();
        const remaining = songList.querySelectorAll(".song").length;
        playlistTitle.textContent = `${playlistSelect.value} (${remaining} song${remaining === 1 ? "" : "s"})`;

        if (!remaining) {
            renderSongs([]);
        }

        setStatus(`Deleted ${song.title}.`);
    } catch (error) {
        setStatus(error.message || "Could not delete song.");
    }
}

loadButton.addEventListener("click", loadPlaylist);
playlistSelect.addEventListener("change", loadPlaylist);
</script>
</main>
<script src="{{ url_for('static', filename='persistent_player.js') }}"></script>
</body>
</html>
