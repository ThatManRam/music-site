<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Error {{ code }}</title>
<style>
body{background:#101216;color:#eee;font-family:system-ui,sans-serif;padding:40px 40px 90px}
a{color:#80aaff}
.persistent-player{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#181b21;border-top:1px solid #383d48;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
.persistent-player-inner{max-width:1000px;margin:auto;padding:8px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.mini-song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem;font-weight:600}
.mini-controls{display:flex;gap:6px;align-items:center}.mini-controls button{width:44px;height:44px;padding:0;font-size:18px;display:grid;place-items:center;border:0;border-radius:8px;background:#2b6df3;color:#fff}.mini-controls button:disabled{opacity:.4;cursor:not-allowed}
.persistent-player audio{display:none}
@media(max-width:600px){.persistent-player-inner{padding:7px 10px}.mini-song{font-size:.88rem}.mini-controls{gap:4px}.mini-controls button{width:40px;height:40px}.persistent-player-inner{grid-template-columns:minmax(0,1fr) auto}}
</style>
</head>
<body>
<div id="persistentPlayer" class="persistent-player" hidden>
  <div class="persistent-player-inner">
    <div class="mini-song" id="persistentTitle">Nothing playing</div>
    <div class="mini-controls" aria-label="Music controls">
      <button id="miniPrevious" type="button" aria-label="Previous song">⏮</button>
      <button id="miniPlayPause" type="button" aria-label="Play or pause">▶</button>
      <button id="miniNext" type="button" aria-label="Next song">⏭</button>
    </div>
    <audio id="persistentAudio" preload="metadata" playsinline></audio>
  </div>
</div>
<h1>Error {{ code }}</h1>
<p>{{ message }}</p>
<a href="{{ url_for('index') }}">Return to Music Server</a>
<script nonce="{{ csp_nonce }}">
(function () {
    const storageKey = "musicPlayerState";
    const bar = document.getElementById("persistentPlayer");
    const title = document.getElementById("persistentTitle");
    const previous = document.getElementById("miniPrevious");
    const playPause = document.getElementById("miniPlayPause");
    const next = document.getElementById("miniNext");
    const audio = document.getElementById("persistentAudio");

    if (!bar || !title || !previous || !playPause || !next || !audio) return;

    let state = null;
    try { state = JSON.parse(localStorage.getItem(storageKey) || "null"); } catch (_) { return; }
    if (!state || !state.url) return;

    function save(updates) {
        state = Object.assign(state || {}, updates);
        localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function updateButton() {
        playPause.textContent = audio.paused ? "▶" : "⏸";
        playPause.setAttribute("aria-label", audio.paused ? "Play" : "Pause");
    }

    function changeTrack(direction) {
        if (!Array.isArray(state.queue) || !state.queue.length) return;
        let index = Number.isInteger(state.currentIndex) ? state.currentIndex : 0;
        index = (index + direction + state.queue.length) % state.queue.length;
        const track = state.queue[index];
        save({ title: track.title, url: track.url, currentIndex: index, currentTime: 0, playing: true });
        audio.src = track.url;
        if ("mediaSession" in navigator) {
        try { navigator.mediaSession.setActionHandler("play", function () { audio.play().catch(function () {}); }); } catch (_) {}
        try { navigator.mediaSession.setActionHandler("pause", function () { audio.pause(); }); } catch (_) {}
        try { navigator.mediaSession.setActionHandler("previoustrack", function () { changeTrack(-1); }); } catch (_) {}
        try { navigator.mediaSession.setActionHandler("nexttrack", function () { changeTrack(1); }); } catch (_) {}
    }

    title.textContent = "Now playing: " + (track.title || "Unknown song");
        audio.play().catch(function () {});
    }

    title.textContent = "Now playing: " + (state.title || "Unknown song");
    audio.src = state.url;
    bar.hidden = false;
    previous.disabled = !(Array.isArray(state.queue) && state.queue.length > 1);
    next.disabled = previous.disabled;

    audio.addEventListener("loadedmetadata", function () {
        if (Number.isFinite(state.currentTime) && state.currentTime > 0) {
            try { audio.currentTime = Math.min(state.currentTime, audio.duration || state.currentTime); } catch (_) {}
        }
        if (state.playing) audio.play().catch(function () {});
    }, { once: true });

    previous.addEventListener("click", function () { changeTrack(-1); });
    next.addEventListener("click", function () { changeTrack(1); });
    playPause.addEventListener("click", function () {
        if (audio.paused) audio.play().catch(function () {});
        else audio.pause();
    });

    audio.addEventListener("play", function () { save({ playing: true, currentTime: audio.currentTime }); updateButton(); });
    audio.addEventListener("pause", function () { save({ playing: false, currentTime: audio.currentTime }); updateButton(); });
    audio.addEventListener("timeupdate", function () { save({ currentTime: audio.currentTime, playing: !audio.paused }); });
    audio.addEventListener("ended", function () { changeTrack(1); });
    updateButton();
})();
</script>
</body>
</html>
