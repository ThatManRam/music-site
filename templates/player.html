<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Player</title>
<style>
body{margin:0;background:#101216;color:#eee;font-family:system-ui,sans-serif;padding-bottom:78px}
main{max-width:1000px;margin:auto;padding:20px}
.card{background:#181b21;padding:20px;border-radius:14px;margin:14px 0}
nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
a{color:#80aaff}
button,select,input{padding:10px;border-radius:8px;border:1px solid #383d48;background:#0e1014;color:#fff}
button{cursor:pointer;background:#2b6df3;border:0}
button.danger{background:#a52b2b}
#songList{display:grid;gap:8px}
.song{padding:12px;background:#0e1014;border-radius:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.song-title{flex:1;min-width:180px}
.persistent-player{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#181b21;border-top:1px solid #383d48;box-shadow:0 -4px 14px rgba(0,0,0,.35)}
.persistent-player-inner{max-width:1100px;margin:auto;padding:7px 14px;display:grid;grid-template-columns:minmax(140px,1fr) auto;gap:6px 12px;align-items:center}
.mini-song{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem;font-weight:600}
.mini-controls{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mini-controls button{min-width:38px;height:38px;padding:0 8px;font-size:15px;display:grid;place-items:center;border:0;border-radius:7px;background:#2b6df3;color:#fff;cursor:pointer}
.mini-controls button.active{background:#24a148}
.mini-controls button:disabled{opacity:.4;cursor:not-allowed}
.mini-progress{grid-column:1 / -1;display:grid;grid-template-columns:auto minmax(80px,1fr) auto;gap:8px;align-items:center;font-size:.75rem;color:#aeb6c3}
.mini-progress-track{position:relative;width:100%;height:20px;display:flex;align-items:center}
.mini-progress-track .mini-buffered{position:absolute;left:0;right:auto;top:50%;height:4px;transform:translateY(-50%);width:0;background:#70757d;border-radius:3px;pointer-events:none}
.mini-progress-track input{position:relative;z-index:1;width:100%;margin:0;padding:0;accent-color:#2b6df3;background:transparent}
.persistent-player audio{display:none}
body{padding-bottom:92px}
@media(max-width:600px){
  .persistent-player-inner{padding:6px 8px;grid-template-columns:1fr}
  .mini-song{font-size:.82rem}
  .mini-controls{justify-content:center}
  .mini-controls button{min-width:36px;height:36px;padding:0 6px;font-size:14px}
  .mini-progress{gap:5px}
  body{padding-bottom:112px}
}

</style>
</head>
<body>
<div id="persistentPlayer" class="persistent-player" hidden>
  <div class="persistent-player-inner">
    <div class="mini-song" id="persistentTitle">Nothing playing</div>
    <div class="mini-controls" aria-label="Music controls">
      <button id="miniPrevious" type="button" aria-label="Previous song">⏮</button>
      <button id="miniPlayPause" type="button" aria-label="Play or pause">▶</button>
      <button id="miniNext" type="button" aria-label="Next song">⏭</button>
      <button id="miniAutoplay" type="button" aria-label="Toggle autoplay" aria-pressed="true">AUTO</button>
      <button id="miniLoop" type="button" aria-label="Toggle loop" aria-pressed="false">↻</button>
      <button id="miniShuffle" type="button" aria-label="Toggle shuffle" aria-pressed="false">🔀</button>
    </div>
    <div class="mini-progress">
      <span id="miniCurrentTime">0:00</span>
      <div class="mini-progress-track" role="group" aria-label="Song loading and position"><div id="miniBuffered" class="mini-buffered" role="progressbar" aria-label="Buffered audio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div><input id="miniProgress" type="range" min="0" max="0" value="0" step="0.1" aria-label="Song position" disabled></div>
      <span id="miniDuration">0:00</span>
    </div>
    <audio id="persistentAudio" preload="metadata" playsinline></audio>
  </div>
</div>
<main>
<nav>
<a href="{{ url_for('index') }}">Downloader</a>
<a href="{{ url_for('player') }}">Player</a>
<a href="{{ url_for('library') }}">Library</a>
<form method="post" action="{{ url_for('logout') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button type="submit">Log out</button>
</form>
</nav>

<section class="card">
<h1>Music Player</h1>

<label for="playlistSelect">Playlist</label>
<select id="playlistSelect"></select>

<div style="margin-top:12px">
<input id="newPlaylist" maxlength="64" placeholder="New playlist name">
<button id="createButton" type="button">Create</button>
<button id="deleteButton" type="button" class="danger">Delete playlist</button>
</div>

<label for="songSearch">Search playlist</label>
<input id="songSearch" type="search" maxlength="100" placeholder="Search songs..." autocomplete="off">
<p id="songSearchStatus"></p>

<div id="songList"></div>
</section>

<script nonce="{{ csp_nonce }}">
const csrfToken = {{ csrf_token|tojson }};
const playlists = {{ playlists|tojson }};

const select = document.getElementById("playlistSelect");
const list = document.getElementById("songList");
const songSearch = document.getElementById("songSearch");
const songSearchStatus = document.getElementById("songSearchStatus");
let currentIndex = 0;
let currentSongs = [];

for (const name of Object.keys(playlists)) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    select.appendChild(option);
}

const savedPlayerState = window.PersistentPlayer ? window.PersistentPlayer.getState() : null;
if (savedPlayerState && savedPlayerState.playlist && playlists[savedPlayerState.playlist]) {
    select.value = savedPlayerState.playlist;
}

function renderSongs() {
    const allSongs = playlists[select.value] || [];
    const query = songSearch.value.trim().toLocaleLowerCase();
    currentSongs = allSongs.filter(song => !query || song.title.toLocaleLowerCase().includes(query));

    list.replaceChildren();
    songSearchStatus.textContent = query
        ? `${currentSongs.length} of ${allSongs.length} song${allSongs.length === 1 ? "" : "s"} found.`
        : "";

    const saved = window.PersistentPlayer ? window.PersistentPlayer.getState() : null;

    currentSongs.forEach((song, index) => {
        const row = document.createElement("div");
        row.className = "song";

        const title = document.createElement("span");
        title.className = "song-title";
        title.textContent = song.title;

        const isPlaying = saved && saved.queue && saved.queue[saved.currentIndex] &&
            saved.queue[saved.currentIndex].url === song.url && saved.playing;
        if (isPlaying) {
            row.classList.add("playing");
        }

        const play = document.createElement("button");
        play.type = "button";
        play.className = "play-button";
        play.textContent = isPlaying ? "Playing" : "Play";
        play.addEventListener("click", () => {
            currentIndex = index;
            if (window.PersistentPlayer) {
                window.PersistentPlayer.setQueue(currentSongs, index, select.value, true);
            }
            renderSongs();
        });

        const moveSelect = document.createElement("select");
        for (const destination of Object.keys(playlists)) {
            if (destination !== select.value) {
                const option = document.createElement("option");
                option.value = destination;
                option.textContent = "Move to " + destination;
                moveSelect.appendChild(option);
            }
        }

        const move = document.createElement("button");
        move.type = "button";
        move.className = "move-button";
        move.textContent = "Move";
        move.addEventListener("click", () => moveSong(song, moveSelect.value));

        row.append(title, play, moveSelect, move);
        list.appendChild(row);
    });
}

async function moveSong(song, destination) {
    if (!destination) {
        return;
    }

    const response = await fetch("{{ url_for('move_song') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body: JSON.stringify({
            source_drive: song.drive_index,
            source_path: song.path,
            destination_playlist: destination
        })
    });

    const data = await response.json();
    if (!response.ok) {
        alert(data.error || "Could not move song.");
        return;
    }

    const source = select.value;
    playlists[source] = playlists[source].filter(
        item => !(item.path === song.path && item.drive_index === song.drive_index)
    );

    playlists[destination] = playlists[destination] || [];
    playlists[destination].push({ ...song, path: destination + "/" + song.filename });

    renderSongs();
}

songSearch.addEventListener("input", () => {
    currentIndex = 0;
    renderSongs();
});

select.addEventListener("change", () => {
    currentIndex = 0;
    songSearch.value = "";
    renderSongs();
});

document.getElementById("createButton").addEventListener("click", async () => {
    const input = document.getElementById("newPlaylist");
    const name = input.value.trim();
    if (!name || name.length > 64) {
        alert("Invalid playlist name.");
        return;
    }

    const response = await fetch("{{ url_for('create_playlist_route') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken },
        body: JSON.stringify({ name })
    });
    const data = await response.json();
    if (!response.ok) {
        alert(data.error || "Could not create playlist.");
        return;
    }
    window.location.reload();
});

document.getElementById("deleteButton").addEventListener("click", async () => {
    const name = select.value;
    if (!name || name === "Singles") {
        alert("Singles cannot be deleted.");
        return;
    }
    if (!confirm("Permanently delete this playlist and its files?")) {
        return;
    }

    const response = await fetch("{{ url_for('delete_playlist_route') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken },
        body: JSON.stringify({ name })
    });
    const data = await response.json();
    if (!response.ok) {
        alert(data.error || "Could not delete playlist.");
        return;
    }
    window.location.reload();
});

renderSongs();
</script>
</main>
<script src="{{ url_for('static', filename='persistent_player.js') }}"></script>
</body>
</html>
