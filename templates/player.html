<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Player</title>
<style>
body{margin:0;background:#101216;color:#eee;font-family:system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:20px}
.card{background:#181b21;padding:20px;border-radius:14px;margin:14px 0}
nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
a{color:#80aaff}
button,select{padding:10px;border-radius:8px;border:1px solid #383d48;background:#0e1014;color:#fff}
button{cursor:pointer;background:#2b6df3;border:0}
button.danger{background:#a52b2b}
#songList{display:grid;gap:8px}
.song{padding:12px;background:#0e1014;border-radius:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.song-title{flex:1;min-width:180px}
audio{width:100%;margin:10px 0}
.persistent-player{position:fixed;top:0;left:0;right:0;z-index:100;background:#181b21;border-bottom:1px solid #383d48;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.persistent-player-inner{max-width:1000px;margin:auto;padding:8px 20px;display:grid;grid-template-columns:minmax(120px,1fr) minmax(260px,2fr) auto;gap:10px;align-items:center}
.persistent-player-inner strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.persistent-player-inner audio{margin:0;width:100%}
body:has(.persistent-player:not([hidden])){padding-top:72px}
@media(max-width:600px){.persistent-player-inner{padding:7px 10px;grid-template-columns:1fr auto}.persistent-player-inner audio{grid-column:1 / -1}.persistent-player-inner a{font-size:.85rem}}
.player-dock{position:sticky;top:0;z-index:20;background:#181b21;border:1px solid #2d323c;border-radius:14px;padding:14px;margin:14px 0;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls button{min-height:44px}
.song.playing{outline:2px solid #32b85a;background:#13251a}
.song.playing .play-button{background:#24a148}
.song.play-button{background:#2b6df3}
@media (max-width:600px){
  main{padding:10px}
  .card{padding:12px}
  .player-dock{top:0;margin:8px 0 14px;padding:10px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .controls button{width:100%;min-height:48px;font-size:16px}
  #playPause{grid-column:1 / -1}
  .song{align-items:stretch}
  .song-title{min-width:0;width:100%}
  .song .play-button{flex:1;min-height:44px}
  .song select,.song .move-button{min-height:44px}
}

</style>
</head>
<body>
<div id="persistentPlayer" class="persistent-player" hidden>
  <div class="persistent-player-inner">
    <strong id="persistentTitle">Nothing playing</strong>
    <audio id="audio" controls preload="metadata" playsinline></audio>
    <a href="{{ url_for('player') }}">Open Player</a>
  </div>
</div>
<main>
<nav>
<a href="{{ url_for('index') }}">Downloader</a>
<a href="{{ url_for('player') }}">Player</a>
<a href="{{ url_for('library') }}">Library</a>
<form method="post" action="{{ url_for('logout') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button type="submit">Log out</button>
</form>
</nav>

<section class="card">
<h1>Music Player</h1>

<label for="playlistSelect">Playlist</label>
<select id="playlistSelect"></select>

<div style="margin-top:12px">
<input id="newPlaylist" maxlength="64" placeholder="New playlist name">
<button id="createButton" type="button">Create</button>
<button id="deleteButton" type="button" class="danger">Delete playlist</button>
</div>

<label for="songSearch">Search playlist</label>
<input id="songSearch" type="search" maxlength="100" placeholder="Search songs..." autocomplete="off">
<p id="songSearchStatus"></p>

<div class="player-dock">
<p id="nowPlaying">Nothing playing</p>
<div class="controls">
<button id="previous" type="button">Previous</button>
<button id="playPause" type="button">Play / Pause</button>
<button id="next" type="button">Next</button>
<button id="loopToggle" type="button" aria-pressed="false">Loop: Off</button>
<button id="autoplayToggle" type="button" aria-pressed="true">Autoplay: On</button>
</div>
</div>
<div id="songList"></div>
</section>

<script nonce="{{ csp_nonce }}">
const csrfToken = {{ csrf_token|tojson }};
const playlists = {{ playlists|tojson }};

const persistentPlayer = document.getElementById("persistentPlayer");
const persistentTitle = document.getElementById("persistentTitle");
const persistentStorageKey = "musicPlayerState";

function savePlayerState(song) {
    if (!song || !song.url) {
        return;
    }

    localStorage.setItem(persistentStorageKey, JSON.stringify({
        title: song.title,
        url: song.url,
        playlist: select ? select.value : "",
        currentTime: Number.isFinite(audio.currentTime) ? audio.currentTime : 0,
        playing: !audio.paused
    }));
}

function restorePlayerState() {
    try {
        const raw = localStorage.getItem(persistentStorageKey);
        if (!raw) {
            return;
        }

        const state = JSON.parse(raw);
        if (!state || !state.url) {
            return;
        }

        audio.src = state.url;
        audio.addEventListener("loadedmetadata", () => {
            if (Number.isFinite(state.currentTime) && state.currentTime > 0) {
                try {
                    audio.currentTime = Math.min(state.currentTime, audio.duration || state.currentTime);
                } catch (_) {}
            }
        }, { once: true });
        persistentTitle.textContent = "Now playing: " + (state.title || "Unknown song");
        persistentPlayer.hidden = false;
    } catch (_) {
        localStorage.removeItem(persistentStorageKey);
    }
}

const select = document.getElementById("playlistSelect");
const audio = document.getElementById("audio");
const list = document.getElementById("songList");
const songSearch = document.getElementById("songSearch");
const songSearchStatus = document.getElementById("songSearchStatus");
const nowPlaying = document.getElementById("nowPlaying");
const loopToggle = document.getElementById("loopToggle");
const autoplayToggle = document.getElementById("autoplayToggle");
let currentIndex = 0;
let currentSongs = [];
let autoplayEnabled = true;

// iOS/Safari can pause a web audio element when another app or video takes
// control of the device audio session. Keep track of whether the pause was
// intentional so we can distinguish a user pause from an interruption.
let intentionalPause = false;
let interruptedPlayback = false;
let resumeAttemptTimer = null;

for (const name of Object.keys(playlists)) {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    select.appendChild(option);
}

function updateMediaSession(song) {
    if (!("mediaSession" in navigator) || !("MediaMetadata" in window)) {
        return;
    }

    navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title,
        artist: "Local Music Library",
        album: select.value
    });
}

function renderSongs() {
    const allSongs = playlists[select.value] || [];
    const query = songSearch.value.trim().toLocaleLowerCase();

    currentSongs = allSongs.filter(song => {
        if (!query) {
            return true;
        }
        return song.title.toLocaleLowerCase().includes(query);
    });

    list.replaceChildren();

    if (query) {
        songSearchStatus.textContent = `${currentSongs.length} of ${allSongs.length} song${allSongs.length === 1 ? "" : "s"} found.`;
    } else {
        songSearchStatus.textContent = "";
    }

    currentSongs.forEach((song, index) => {
        const row = document.createElement("div");
        row.className = "song";

        const title = document.createElement("span");
        title.className = "song-title";
        title.textContent = song.title;

        const isPlaying = currentSongs[index] === currentSongs[currentIndex] &&
            audio.src && !audio.paused;

        if (isPlaying) {
            row.classList.add("playing");
        }

        const play = document.createElement("button");
        play.type = "button";
        play.className = "play-button";
        play.textContent = isPlaying ? "Playing" : "Play";
        play.setAttribute("aria-pressed", String(isPlaying));
        play.addEventListener("click", () => playSong(index));

        const moveSelect = document.createElement("select");

        for (const destination of Object.keys(playlists)) {
            if (destination !== select.value) {
                const option = document.createElement("option");
                option.value = destination;
                option.textContent = "Move to " + destination;
                moveSelect.appendChild(option);
            }
        }

        const move = document.createElement("button");
        move.type = "button";
        move.className = "move-button";
        move.textContent = "Move";
        move.addEventListener("click", () => moveSong(song, moveSelect.value));

        row.append(title, play, moveSelect, move);
        list.appendChild(row);
    });
}

function playSong(index) {
    if (!currentSongs[index]) {
        return;
    }

    currentIndex = index;
    const song = currentSongs[index];

    audio.src = song.url;
    persistentTitle.textContent = "Now playing: " + song.title;
    persistentPlayer.hidden = false;
    savePlayerState(song);
    audio.play().catch(() => {});
    nowPlaying.textContent = "Now playing: " + song.title;
    updateMediaSession(song);
    renderSongs();
}

function nextSong() {
    if (!currentSongs.length) {
        return;
    }

    currentIndex = (currentIndex + 1) % currentSongs.length;
    playSong(currentIndex);
}

function previousSong() {
    if (!currentSongs.length) {
        return;
    }

    currentIndex =
        (currentIndex - 1 + currentSongs.length) % currentSongs.length;

    playSong(currentIndex);
}

async function moveSong(song, destination) {
    if (!destination) {
        return;
    }

    const response = await fetch("{{ url_for('move_song') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body: JSON.stringify({
            source_drive: song.drive_index,
            source_path: song.path,
            destination_playlist: destination
        })
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.error || "Could not move song.");
        return;
    }

    const source = select.value;
    playlists[source] = playlists[source].filter(
        item => !(item.path === song.path && item.drive_index === song.drive_index)
    );

    playlists[destination] = playlists[destination] || [];
    playlists[destination].push({
        ...song,
        path: destination + "/" + song.filename
    });

    if (currentSongs[currentIndex] === song) {
        intentionalPause = true;
        interruptedPlayback = false;
        audio.pause();
        audio.removeAttribute("src");
        nowPlaying.textContent = "Nothing playing";
    }

    renderSongs();
}

songSearch.addEventListener("input", () => {
    currentIndex = 0;
    renderSongs();
});

select.addEventListener("change", () => {
    currentIndex = 0;
    songSearch.value = "";
    intentionalPause = true;
    interruptedPlayback = false;
    audio.pause();
    audio.removeAttribute("src");
    nowPlaying.textContent = "Nothing playing";
    renderSongs();
});

document.getElementById("playPause").addEventListener("click", () => {
    if (audio.paused) {
        interruptedPlayback = false;
        intentionalPause = false;

        if (!audio.src && currentSongs.length) {
            playSong(currentIndex);
        } else {
            audio.play().catch(() => {});
        }
    } else {
        intentionalPause = true;
        interruptedPlayback = false;
        audio.pause();
    }
});

document.getElementById("next").addEventListener("click", nextSong);
document.getElementById("previous").addEventListener("click", previousSong);

audio.addEventListener("ended", () => {
    if (autoplayEnabled && !audio.loop) {
        nextSong();
    }
});

loopToggle.addEventListener("click", () => {
    audio.loop = !audio.loop;
    loopToggle.setAttribute("aria-pressed", String(audio.loop));
    loopToggle.textContent = audio.loop ? "Loop: On" : "Loop: Off";
});

autoplayToggle.addEventListener("click", () => {
    autoplayEnabled = !autoplayEnabled;
    autoplayToggle.setAttribute("aria-pressed", String(autoplayEnabled));
    autoplayToggle.textContent = autoplayEnabled ? "Autoplay: On" : "Autoplay: Off";
});

document.getElementById("createButton").addEventListener("click", async () => {
    const input = document.getElementById("newPlaylist");
    const name = input.value.trim();

    if (!name || name.length > 64) {
        alert("Invalid playlist name.");
        return;
    }

    const response = await fetch("{{ url_for('create_playlist_route') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body: JSON.stringify({name})
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.error || "Could not create playlist.");
        return;
    }

    window.location.reload();
});

document.getElementById("deleteButton").addEventListener("click", async () => {
    const name = select.value;

    if (!name || name === "Singles") {
        alert("Singles cannot be deleted.");
        return;
    }

    if (!confirm("Permanently delete this playlist and its files?")) {
        return;
    }

    const response = await fetch("{{ url_for('delete_playlist_route') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body: JSON.stringify({name})
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.error || "Could not delete playlist.");
        return;
    }

    window.location.reload();
});

// -------------------------------------------------------------------------
// Media Session controls
//
// Only register track navigation here. In iPhone Safari, registering the
// seekbackward/seekforward/seekto actions can cause the Lock Screen / Control
// Center to show the +/- 10 second controls instead of Previous / Next Track.
// The audio element still supports normal seeking from the player itself.
// -------------------------------------------------------------------------

if ("mediaSession" in navigator) {
    try {
        navigator.mediaSession.setActionHandler("play", () => {
            if (!audio.src && currentSongs.length) {
                playSong(currentIndex);
                return;
            }

            audio.play().catch(() => {});
        });
    } catch (_) {}

    try {
        navigator.mediaSession.setActionHandler("pause", () => {
            // A pause command from the iPhone Lock Screen is intentional.
            intentionalPause = true;
            interruptedPlayback = false;
            audio.pause();
        });
    } catch (_) {}

    try {
        navigator.mediaSession.setActionHandler("nexttrack", () => {
            nextSong();
        });
    } catch (_) {}

    try {
        navigator.mediaSession.setActionHandler("previoustrack", () => {
            previousSong();
        });
    } catch (_) {}
}

audio.addEventListener("play", () => {
    // A successful play means the interruption has been recovered.
    intentionalPause = false;
    interruptedPlayback = false;

    if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = "playing";
    }
    const state = localStorage.getItem(persistentStorageKey);
    if (state) {
        try {
            const saved = JSON.parse(state);
            saved.playing = true;
            saved.currentTime = audio.currentTime;
            localStorage.setItem(persistentStorageKey, JSON.stringify(saved));
        } catch (_) {}
    }
    renderSongs();
});

audio.addEventListener("timeupdate", () => {
    const state = localStorage.getItem(persistentStorageKey);
    if (!state || !audio.src) {
        return;
    }

    try {
        const saved = JSON.parse(state);
        saved.currentTime = audio.currentTime;
        saved.playing = !audio.paused;
        localStorage.setItem(persistentStorageKey, JSON.stringify(saved));
    } catch (_) {}
});

audio.addEventListener("pause", () => {
    if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = "paused";
    }

    // Do not treat an intentional user pause as an interruption. If Safari
    // pauses the audio because another app/video takes over, this event is
    // not preceded by our intentional-pause flag, so remember the playback
    // position and try to resume when Safari becomes active again.
    if (
        !intentionalPause &&
        audio.src &&
        Number.isFinite(audio.currentTime) &&
        audio.currentTime > 0 &&
        (!Number.isFinite(audio.duration) || audio.currentTime < audio.duration - 0.25)
    ) {
        interruptedPlayback = true;
    }

    const state = localStorage.getItem(persistentStorageKey);
    if (state) {
        try {
            const saved = JSON.parse(state);
            saved.currentTime = audio.currentTime;
            saved.playing = interruptedPlayback;
            localStorage.setItem(persistentStorageKey, JSON.stringify(saved));
        } catch (_) {}
    }

    intentionalPause = false;
    renderSongs();
});

function attemptInterruptedPlaybackResume() {
    if (!interruptedPlayback || !audio.src || !audio.paused) {
        return;
    }

    if (document.visibilityState !== "visible") {
        return;
    }

    if (resumeAttemptTimer !== null) {
        window.clearTimeout(resumeAttemptTimer);
    }

    // Give Safari a moment to release the audio session from the other video.
    resumeAttemptTimer = window.setTimeout(() => {
        resumeAttemptTimer = null;

        if (!interruptedPlayback || !audio.src || !audio.paused) {
            return;
        }

        audio.play().catch(() => {
            // iOS may require another user gesture after an interruption.
            // Keep the interruption state so a later visibility/focus event
            // can try again instead of losing the song position.
        });
    }, 250);
}

// When the user returns to Safari after another video/app used the audio
// session, attempt to continue the song from the exact position where it was
// interrupted.
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        attemptInterruptedPlaybackResume();
    }
});

window.addEventListener("focus", () => {
    attemptInterruptedPlaybackResume();
});

window.addEventListener("pageshow", () => {
    attemptInterruptedPlaybackResume();
});

renderSongs();
restorePlayerState();
</script>
</main>
</body>
</html>
